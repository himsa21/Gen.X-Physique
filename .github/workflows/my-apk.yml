name: Build my APK
on:
  workflow_dispatch:
  push:
    branches: [genx-dev]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk genx-physique-arm64.apk
          gh release create "build-${{ github.run_number }}" genx-physique-arm64.apk --target "${{ github.sha }}" --title "Build ${{ github.run_number }}" --notes "Test build" --prerelease
